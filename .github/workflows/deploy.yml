name: Deploy API a Azure Container Apps

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: mlopssemana3kf26
  IMAGE: mlops-api
  RESOURCE_GROUP: rg-mlops-ean
  CONTAINER_APP: mlops-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login en el registro
        run: az acr login --name $REGISTRY

      - name: Construir y subir la imagen
        run: |
          docker build -t $REGISTRY.azurecr.io/$IMAGE:${{ github.sha }} .
          docker push $REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}

      - name: Actualizar la Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}
